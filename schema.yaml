# JSON Schema (YAML format) for clickup-yaml-sync project files
# Validate with: python3 -c "import jsonschema, yaml; jsonschema.validate(yaml.safe_load(open('project.yaml')), yaml.safe_load(open('schema.yaml')))"
# Or install: pip install jsonschema pyyaml

$schema: "http://json-schema.org/draft-07/schema#"
title: ClickUp YAML Project File
description: Project definition file for bidirectional sync with ClickUp

type: object
required: [project, status_map, epics]
additionalProperties: true

properties:

  project:
    type: object
    required: [name, clickup_list_id]
    additionalProperties: true
    properties:
      name:
        type: string
        description: Human-readable project name
        example: "Tim Draper Digital Persona"
      clickup_list_id:
        type: string
        description: ClickUp list ID to sync with (find in the list URL)
        pattern: "^[0-9]+$"
        example: "901414096256"
      last_synced:
        type: [string, "null"]
        description: ISO 8601 timestamp of last sync (auto-updated by the tool)
        example: "2026-02-22T05:42:47+00:00"
      epic_dropdown_field_id:
        type: [string, "null"]
        description: >
          Optional UUID of a ClickUp single-select dropdown custom field that
          mirrors the Epic axis (e.g., a PM-curated "Epic" field on the list).
          When set together with epic_dropdown_options, push writes each
          story's epic name to the matching option on every push.
        example: "00000000-0000-0000-0000-000000000000"
      epic_dropdown_options:
        type: object
        description: >
          Mapping from epic name (matches epics[].name, case-insensitive) to
          the ClickUp dropdown option UUID. Skipped silently if not provided.
          Story-level epic_dropdown_value overrides the epic name lookup.
        additionalProperties:
          type: string
        example:
          "Epic One": "11111111-1111-1111-1111-111111111111"
          "Epic Two": "22222222-2222-2222-2222-222222222222"
          "Epic Three": "33333333-3333-3333-3333-333333333333"
          "Epic Four": "44444444-4444-4444-4444-444444444444"
      notes:
        type: [string, "null"]
        description: Free-form notes about the project (not pushed to ClickUp).

  status_map:
    type: object
    description: >
      Mapping from YAML status keys (used in this file) to ClickUp status names
      (as they appear in ClickUp). Keys are used in story/epic status fields.
    additionalProperties:
      type: string
    example:
      done: "done"
      in_progress: "current sprint"
      upcoming_sprint: "upcoming sprint"
      backlog: "backlog"

  epics:
    type: array
    description: >
      Epics are YAML-only groupings — they are NOT created in ClickUp.
      Stories within epics become flat top-level ClickUp tasks, tagged with
      their epic name for grouping.
    items:
      type: object
      required: [name, status, points, stories]
      additionalProperties: true
      properties:

        number:
          type: [integer, "null"]
          description: Epic sequence number (for display only)
          example: 1

        name:
          type: string
          description: >
            Epic name. Also used as the ClickUp tag applied to all stories
            in this epic. Must be unique across epics.
          example: "Core RAG Pipeline"

        status:
          type: string
          description: Epic status (must be a key defined in status_map)
          enum: [done, in_progress, upcoming_sprint, backlog]

        points:
          type: integer
          description: Story point total for the epic
          minimum: 0
          example: 21

        priority:
          type: [integer, "null"]
          description: "ClickUp priority: 1=urgent, 2=high, 3=normal, 4=low"
          enum: [1, 2, 3, 4, null]

        sprint:
          type: [integer, "null"]
          description: Sprint number this epic is planned for
          example: 1

        pr:
          type: [string, "null"]
          description: PR reference(s) associated with this epic
          example: "#1"

        milestone:
          type: boolean
          description: Whether this epic is a milestone
          default: false

        description:
          type: [string, "null"]
          description: Epic description (markdown supported)

        stories:
          type: array
          description: >
            Stories within this epic. Each story becomes a flat top-level
            ClickUp task tagged with the epic name.
          items:
            type: object
            required: [name, status, points]
            additionalProperties: true
            properties:

              name:
                type: string
                description: >
                  Story title. Convention: "As a <role>, I want <feature>
                  so that <benefit>"
                example: "As a developer, I want X so that Y"

              clickup_id:
                type: [string, "null"]
                description: >
                  ClickUp internal task ID (e.g. "86b8f2a23"). Populated
                  automatically after first push. Set to null for new stories
                  not yet created in ClickUp. NEVER use placeholder values
                  like "tbd" — use null.
                example: "86b8f2a23"

              task_id:
                type: [string, "null"]
                description: >
                  ClickUp custom task ID (e.g. "TASK-6593"). Populated
                  automatically after first push.
                example: "TASK-6593"

              points:
                type: integer
                description: Story point estimate
                minimum: 0
                example: 5

              status:
                type: string
                description: Story status (must be a key defined in status_map)
                enum: [done, in_progress, upcoming_sprint, backlog]

              priority:
                type: [integer, "null"]
                description: "ClickUp priority: 1=urgent, 2=high, 3=normal, 4=low. Inherits from epic if not set."
                enum: [1, 2, 3, 4, null]

              milestone:
                type: boolean
                description: Whether this story is a milestone task in ClickUp
                default: false

              milestone_label:
                type: [string, "null"]
                description: >
                  Optional SOW milestone reference, as `M<n>` or
                  `M<n>-<slug>`. When set, push appends the lowercased value as
                  a tag (`M1` -> `m1`, `M1-infrastructure` ->
                  `m1-infrastructure`), on top of the epic-name tag and any
                  explicit tags[]. A convenience over hand-writing the slug into
                  tags[] — and the point of using it is that the convention then
                  comes from the tool instead of being re-invented per project.

                  **The number carries the sequence; the slug carries the
                  meaning.** A bare `m1` is a handle that tells a reader
                  nothing, which is why the slug form exists. `n` is unbounded:
                  this field was previously an `M0`–`M3` enum, which capped a
                  project at four milestones for no reason a five-milestone SOW
                  would accept.

                  Bare `M0`–`M3` remain valid and unchanged — existing boards
                  using them are not disturbed.

                  The milestone-date lint resolves a card to its gate through
                  this field or through an equivalent `tags:` entry; the two are
                  the same reference by different routes.
                pattern: "^[Mm][0-9]+(-[a-z0-9][a-z0-9-]*)?$"
                examples: ["M1", "M1-infrastructure", "M2-system", "M3-acceptance"]

              sprint_target:
                type: [integer, "null"]
                description: >
                  Optional sprint number this story is planned for. When set,
                  push appends a tag `s<N>` (e.g., sprint_target: 1 -> `s1`)
                  to the story's tag set. Lets you filter ClickUp by any
                  sprint, not just the current one — orthogonal to the
                  `status` field, which carries the WIP state.
                  Sprint slugs are part of the managed tag universe (removing
                  sprint_target from a story strips its `s<N>` tag on next push).
                minimum: 1
                example: 2

              tags:
                type: array
                description: >
                  Additional ClickUp tags to apply to the story (in addition
                  to the epic-name tag and the milestone_label slug). All
                  three sources merge; duplicates are removed case-insensitively.
                  Pre-existing tags on the ClickUp task that ARE NOT in this
                  set are preserved (so UI-added tags survive). The exception:
                  tags that are part of the YAML's "managed tag universe"
                  (epic names + milestone slugs) but not on THIS story are
                  treated as stale and removed — that's how epic/milestone
                  reassignments take effect.
                items:
                  type: string
                example: ["signal-automation", "slack", "security"]

              assignees:
                type: array
                description: >
                  ClickUp assignees for this story, as human-readable strings
                  (emails preferred; usernames also accepted). Push resolves
                  each to a ClickUp user id via the list's member roster and
                  reconciles the task to match exactly; pull writes the remote
                  assignees (as emails) back here. Semantics mirror tags' UI
                  coexistence: OMIT this key to leave ClickUp assignees
                  untouched (so UI-set assignees are preserved); set an EMPTY
                  list to clear all assignees; set a list to make YAML
                  authoritative. Names not found in the roster are warned and
                  skipped, not fatal.
                items:
                  type: string
                example: ["alice@example.com", "bob@example.com"]

              depends_on:
                type: array
                description: >
                  ClickUp tasks this story waits on (a "waiting on" dependency).
                  Each entry is the target task's ClickUp id — the same id stored
                  in another story's clickup_id. Semantics mirror assignees: OMIT
                  this key to leave ClickUp dependencies untouched (UI-added edges
                  survive); set an EMPTY list to clear the task's waiting_on edges;
                  set a list to make YAML authoritative (push adds/removes to
                  match exactly). Only the waiting_on direction is modeled —
                  ClickUp maintains the mirrored "blocking" edge automatically. A
                  target not yet created (no clickup_id) can't be referenced until
                  it exists; the edge resolves on the next run. Reconciled by the
                  relationship second pass in push/sync/merge; read by pull/diff.
                items:
                  type: string
                example: ["86badrnmt"]

              related:
                type: array
                description: >
                  ClickUp tasks this story is linked to (non-blocking "linked
                  tasks" / the relate feature). Each entry is the target task's
                  ClickUp id — the same id stored in another story's clickup_id.
                  Unlike depends_on, a link implies NO ordering or blocking, and
                  is non-directional (ClickUp records it on both endpoints).
                  Semantics mirror depends_on: OMIT this key to leave ClickUp
                  links untouched (UI-added links survive); set an EMPTY list to
                  clear the task's links; set a list to make YAML authoritative
                  (adds/removes to match exactly). A target not yet created (no
                  clickup_id) can't be referenced until it exists; the link
                  resolves on the next run. Reconciled by the relationship second
                  pass in push/sync/merge; read by pull/diff.
                items:
                  type: string
                example: ["86bade1f9"]

              parent:
                type: [string, "null"]
                description: >
                  Makes this story a SUBTASK of another task in ClickUp. The
                  value is normally the parent story's `name` as written in this
                  file (matched case-insensitively, trimmed) — it is resolved to
                  a clickup_id by the relationship second pass, which runs after
                  creates, so a brand-new parent and child link on the FIRST
                  sync. A raw ClickUp id is also accepted, which is how a parent
                  that lives outside this file is referenced — but it must be in
                  the SAME list: a cross-list parent is refused, because ClickUp's
                  PUT would silently move this task into the parent's list (and
                  the next sync would then report it archived). Two stories sharing
                  the referenced name is an error, not a guess. Semantics mirror
                  depends_on: OMIT this key to leave ClickUp's hierarchy
                  untouched (a subtask nested in the UI survives); set it to
                  make YAML authoritative (the task is moved under that parent
                  in place — never delete+recreate). NOTE an empty value is only
                  valid for a task that is already top-level: ClickUp's API
                  cannot un-parent (PUT parent:null returns 200 and does
                  nothing), so declaring no parent for an existing subtask is a
                  loud error — promote it in the ClickUp UI instead. Reconciled
                  by push/sync/merge; read back by pull and shown by diff. Not
                  base-tracked (like the other edges), so a declared parent is
                  applied rather than raised as a 3-way conflict.
                example: "Export contacts hub"

              epic_dropdown_value:
                type: [string, "null"]
                description: >
                  Optional override for the Epic dropdown lookup. If unset,
                  the parent epic's name is used to find the dropdown option.
                  Set this when a story belongs (visually) to one epic but
                  should be tagged as a different epic in Clarisse's field.

              archived_in_clickup:
                type: boolean
                description: Set to true by pull command when task is deleted from ClickUp but remains in YAML
                default: false

              description:
                type: [string, "null"]
                description: Story description (markdown supported)

              due_date:
                type: [string, "null"]
                description: >
                  Due date as YYYY-MM-DD (date-only). Pushed to ClickUp at noon
                  UTC with due_date_time=false; pulled back as the UTC calendar
                  date. Compared at day granularity.
                example: "2026-06-20"

              start_date:
                type: [string, "null"]
                description: >
                  Start date as YYYY-MM-DD (date-only). Same handling as due_date.
                example: "2026-06-15"

              notes:
                type: [string, "null"]
                description: >
                  YAML-only working notes for this story. **Never pushed to
                  ClickUp, never overwritten by pull, never part of any diff or
                  conflict** — it has no remote counterpart, so it cannot
                  conflict. The story-scale equivalent of `project.notes`.

                  **What belongs here: why the card is the way it is.**
                  Provenance — who said a thing on a call, why a threshold is
                  set where it is, which SOW clause an obligation comes from,
                  what was considered and rejected.

                  **What does NOT belong here: anything a reader needs in order
                  to act.** That goes in `description`, which is what people
                  actually read. Acceptance criteria, scope and definition-of-
                  done are description material; putting them in notes hides
                  them from everyone working the board and makes it worse rather
                  than better.

                  The field exists because a description that accumulates
                  context helps whoever WRITES the card and harms whoever READS
                  it — and on a client-visible board an over-long description
                  spends the client's attention on our reasoning instead of
                  their action. Keeping that material adjacent to the card beats
                  the alternatives: on the card, where it hurts the reader, or in
                  a separate document, where it drifts away from what it
                  describes.

                  Authored, not derived: `pull` writes nothing into it. A sync
                  that deposited text here would make it impossible to tell what
                  a human meant from what a tool left behind.
                example: >
                  Threshold split routine vs adversarial per Eric on the
                  2026-08-14 kick-off. SOW clause 4b makes the acceptance window
                  ten business days, which is why the gate is 2026-09-15.

              lint_exceptions:
                type: object
                description: >
                  Per-card acceptances for the milestone-date lint, keyed by the
                  lint's finding code, with a written reason as the value. The
                  lint reports a guideline ClickUp does not enforce, and a date
                  set in the ClickUp UI arrives here via `pull` as legitimate
                  data — so a card needs a way to say "yes, we know" without the
                  lint nagging forever.

                  The value must be a NON-EMPTY STRING explaining why. A bare
                  `true` is deliberately not accepted: a suppression flag with
                  no rationale tells the next reader nothing, and by the time
                  anyone asks, whoever set it has moved on. Accepted findings
                  are still counted in the report, so suppressed is not the same
                  as gone.

                  Codes: `milestone-date` (due after the gate),
                  `milestone-tag-unresolved` (no gate carries that number),
                  `milestone-slug-mismatch` (same number, different slug),
                  `milestone-ambiguous` (two gates share a number),
                  `milestone-gate-undated` (the gate itself has no due date),
                  `milestone-label-malformed` (milestone_label is not M<n> or
                  M<n>-<slug>).
                additionalProperties:
                  type: string
                  minLength: 1
                example:
                  milestone-date: "Client moved the acceptance window; agreed with Eric 2026-08-20"
