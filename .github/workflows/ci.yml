name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No deploy step exists in this repo: CI runs tests only. Merging ships nothing.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Byte-compile (syntax gate, fails fast before the suite)
        run: python -m compileall -q clickup.py tests tools

      - name: Run tests
        # The suite must never reach the network or a real token; tests stamp a
        # fake one before importing clickup. Fail loudly if a real one leaks in.
        env:
          CLICKUP_API_TOKEN: pk_ci_fake_token
          OPENAI_API_KEY: sk_ci_fake_key
        run: python -m pytest tests -q
